<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeeOS v2.0 — Digital Legacy</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{neon:{red:'#ff1a1a',pink:'#ff006e',orange:'#ff6b00',blue:'#0066ff',green:'#00e676',purple:'#b700ff'}}}}}</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;700&display=swap');
*{font-family:'Inter',sans-serif}body{background:#000;color:#e0e0e0;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}

/* Glass panels */
.glass{background:rgba(18,18,18,0.7);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.06);border-radius:20px}
.glass-light{background:rgba(25,25,25,0.6);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.04);border-radius:16px}
.glass-red{background:rgba(255,26,26,0.08);border:1px solid rgba(255,26,26,0.2);border-radius:16px}

/* Neon glow */
.neon-glow{box-shadow:0 0 20px rgba(255,26,26,0.3),0 0 60px rgba(255,26,26,0.1)}
.neon-text{text-shadow:0 0 10px rgba(255,26,26,0.6),0 0 30px rgba(255,26,26,0.3)}
.neon-border{border:1px solid rgba(255,26,26,0.5);box-shadow:0 0 10px rgba(255,26,26,0.2),inset 0 0 10px rgba(255,26,26,0.05)}

/* Animations */
@keyframes pulse-neon{0%,100%{box-shadow:0 0 5px rgba(255,26,26,0.5),0 0 20px rgba(255,26,26,0.2)}50%{box-shadow:0 0 15px rgba(255,26,26,0.8),0 0 40px rgba(255,26,26,0.4),0 0 60px rgba(255,26,26,0.2)}}
@keyframes spin-slow{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes slide-in{from{opacity:0;transform:translateX(-15px)}to{opacity:1;transform:translateX(0)}}
@keyframes scan-line{0%{top:-100%}100%{top:100%}}

.pulse-neon{animation:pulse-neon 2s infinite}
.spin-slow{animation:spin-slow 12s linear infinite}
.float{animation:float 4s ease-in-out infinite}
.breathe{animation:breathe 3s ease-in-out infinite}
.slide-in{animation:slide-in .4s ease-out}

/* Sidebar */
.sidebar{background:rgba(8,8,8,0.95);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,0.04);transition:width .35s cubic-bezier(.4,0,.2,1);width:260px;z-index:40}
.sidebar.collapsed{width:64px}
.sidebar .menu-text{transition:opacity .2s,width .2s;overflow:hidden}
.sidebar.collapsed .menu-text{opacity:0;width:0}
.sidebar-item{transition:all .2s;border-radius:12px;margin:2px 8px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;color:rgba(255,255,255,0.4);font-size:13px;font-weight:500;white-space:nowrap}
.sidebar-item:hover{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.8)}
.sidebar-item.active{background:rgba(255,26,26,0.1);color:#ff1a1a;border:1px solid rgba(255,26,26,0.2)}
.sidebar.collapsed .sidebar-item{justify-content:center;padding:10px}
.sidebar-icon{width:20px;height:20px;flex-shrink:0}

/* Scrollbar */
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}

/* Kanban */
.kanban-col{min-height:120px;transition:all .2s}
.kanban-card{cursor:grab;transition:all .2s}
.kanban-card:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.kanban-card:active{cursor:grabbing}

/* Health rings */
.ring-bg{stroke:rgba(255,255,255,0.06)}
.ring-fg{transition:stroke-dashoffset 1s ease}

/* Chart containers */
.chart-wrap{position:relative;width:100%;height:100%}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:fixed;left:-280px;top:0;height:100vh;width:260px!important;transition:left .35s}
  .sidebar.open{left:0}
  .sidebar.collapsed{left:-280px}
  .mobile-overlay{display:block}
  .menu-hamburger{display:flex!important}
  .sidebar.collapsed .menu-text{opacity:1;width:auto}
}
@media(min-width:769px){.mobile-overlay{display:none}.menu-hamburger{display:none}}

/* Particle BG */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.15}
.particle{position:absolute;width:1px;height:1px;background:#ff1a1a;border-radius:50%;animation:float-particle linear infinite}
@keyframes float-particle{0%{transform:translateY(100vh) scale(0)}10%{transform:translateY(80vh) scale(1)}90%{transform:translateY(10vh) scale(1)}100%{transform:translateY(-10vh) scale(0)}}

/* Focus Blast overlay */
.focus-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.focus-countdown{font-family:'JetBrains Mono',monospace;font-size:8rem;font-weight:900;color:#ff1a1a;text-shadow:0 0 40px rgba(255,26,26,0.8),0 0 100px rgba(255,26,26,0.4)}
</style>
</head>
<body class="min-h-screen">

<!-- PARTICLES -->
<div class="particles" id="particles"></div>

<!-- FOCUS BLAST OVERLAY -->
<div id="focus-overlay" class="focus-overlay hidden">
  <p class="text-sm text-white/30 uppercase tracking-[.3em]">Focus Blast</p>
  <div class="focus-countdown" id="focus-countdown">25:00</div>
  <p class="text-white/50 text-lg" id="focus-task-label">Deep Focus</p>
  <div class="flex gap-4 mt-6">
    <button onclick="pauseFocus()" class="px-6 py-3 rounded-xl bg-white/10 text-white/60 hover:bg-white/20 transition text-sm">⏸ Pause</button>
    <button onclick="stopFocus()" class="px-6 py-3 rounded-xl bg-red-500/20 text-red-400 hover:bg-red-500/30 transition text-sm neon-border">✕ Bitir</button>
  </div>
</div>

<!-- MOBILE OVERLAY -->
<div id="mobile-overlay" class="mobile-overlay fixed inset-0 z-30 hidden" style="background:rgba(0,0,0,0.6)" onclick="closeSidebar()"></div>

<!-- ═══════════ LAYOUT ═══════════ -->
<div class="flex min-h-screen relative">
  
  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar flex flex-col py-4 h-screen sticky top-0">
    <!-- Logo -->
    <div class="flex items-center gap-3 px-4 mb-6 h-10">
      <div class="w-8 h-8 rounded-lg bg-red-500/15 pulse-neon flex items-center justify-center flex-shrink-0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff1a1a" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      </div>
      <span class="menu-text font-bold text-base tracking-tight neon-text">SeeOS</span>
      <span class="menu-text text-[10px] px-1.5 py-0.5 rounded-full bg-red-500/15 text-red-400 font-bold spin-slow" style="animation-duration:8s">v2.0</span>
    </div>

    <!-- Menu -->
    <nav class="flex-1 flex flex-col gap-0.5 overflow-y-auto" id="sidebar-nav"></nav>

    <!-- Focus Blast -->
    <div class="px-2 mt-2 mb-2">
      <button onclick="startFocusBlast()" class="w-full py-3 rounded-xl font-bold text-sm uppercase tracking-wider flex items-center justify-center gap-2 pulse-neon neon-border" style="background:rgba(255,26,26,0.12);color:#ff1a1a">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ff1a1a" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span class="menu-text">⚡ Focus Blast</span>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col min-h-screen relative z-10">
    <!-- HEADER -->
    <header class="flex items-center justify-between px-6 py-3 border-b border-white/5" style="background:rgba(0,0,0,0.5);backdrop-filter:blur(20px)">
      <div class="flex items-center gap-4">
        <button class="menu-hamburger w-8 h-8 items-center justify-center rounded-lg bg-white/5 text-white/60 hover:text-white hidden" onclick="toggleSidebar()">☰</button>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white/90">SeeOS <span class="text-red-500">v2.0</span></h1>
          <p class="text-[10px] text-white/30">Digital Legacy Command</p>
        </div>
      </div>
      <div class="flex items-center gap-6">
        <div class="text-right">
          <p id="header-time" class="text-sm font-semibold text-white/70 mono">00:00</p>
          <p id="header-date" class="text-[10px] text-white/30">---</p>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full glass-light">
          <span class="text-xs">🌤</span>
          <span class="text-[10px] text-white/40">İstanbul, 24°C</span>
        </div>
        <div id="header-avatar" class="w-9 h-9 rounded-full border-2 border-red-500/30 overflow-hidden cursor-pointer hover:border-red-400 transition flex items-center justify-center bg-white/5" onclick="document.getElementById('avatar-upload').click()" title="Profil fotoğrafı">
          <img id="avatar-img" class="w-full h-full object-cover hidden" />
          <svg id="avatar-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <input type="file" id="avatar-upload" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
      </div>
    </header>

    <!-- CONTENT AREA -->
    <div class="flex-1 p-6 overflow-y-auto" id="main-content">
      <!-- All tab contents rendered here by JS -->
    </div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════
// DATA LAYER — localStorage
// ═══════════════════════════════════════════
const LS = {
  get(k, def) { try { const v = localStorage.getItem('seeos_'+k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { localStorage.setItem('seeos_'+k, JSON.stringify(v)); }
};

// Default dummy data
function defaultData() { return {
  sleep: [
    {date:'14 Haz',hours:6.2,quality:7},{date:'15 Haz',hours:7.8,quality:9},
    {date:'16 Haz',hours:5.4,quality:5},{date:'17 Haz',hours:8.1,quality:9},
    {date:'18 Haz',hours:4.9,quality:4},{date:'19 Haz',hours:6.5,quality:7},
    {date:'Bugün',hours:7.2,quality:8}
  ],
  study: [
    {subject:'TYT Matematik',hours:4.5,focus:9},{subject:'AYT Fizik',hours:3.2,focus:8},
    {subject:'TYT Türkçe',hours:2.8,focus:7},{subject:'AYT Kimya',hours:3.5,focus:9},
    {subject:'TYT Sosyal',hours:2.0,focus:6},{subject:'AYT Biyoloji',hours:2.5,focus:8}
  ],
  health: {steps:8432,water:1800,calories:2150,sleepAvg:6.8},
  notes: [
    {id:1,title:'YKS Son Tekrar Planı',content:'30 dk branş denemesi → 20 dk yanlış analizi → 10 dk konu tekrarı',color:'#ff1a1a'},
    {id:2,title:'Motivasyon Sözleri',content:'"Başarı, her gün tekrarlanan küçük çabaların toplamıdır." — Robert Collier',color:'#ff6b00'},
    {id:3,title:'Haftalık Hedefler',content:'📚 45 saat çalışma\n🎯 5 TYT denemesi\n😴 7+ saat uyku\n🏃 10K adım',color:'#0066ff'}
  ],
  tasks: [
    {id:1,title:'TYT Denemesi #24',status:'done',priority:'high'},
    {id:2,title:'AYT İntegral Tekrar',status:'in_progress',priority:'urgent'},
    {id:3,title:'Geometri Soru Bankası Bölüm 3',status:'in_progress',priority:'high'},
    {id:4,title:'Fizik Optik Özet Çıkar',status:'todo',priority:'medium'},
    {id:5,title:'Kimya Organik Notlarını Düzenle',status:'todo',priority:'medium'}
  ],
  whywall: ['"Neden Tıp?" — Çünkü insanlara dokunmak istiyorum.','"Neden her gün?" — Çünkü 1 gün boşlamak 3 gün geriye götürür.','"Neden şimdi?" — Çünkü 2027\'de pişman olmak istemiyorum.'],
  settings: {sidebarCollapsed:false,activeTab:'dashboard'}
};}

let DATA = LS.get('data', defaultData());
let activeTab = DATA.settings?.activeTab || 'dashboard';
let charts = {};
let focusInterval = null, focusRunning = false, focusSeconds = 25*60, focusTask = '';

// Save helper
function save() { LS.set('data', DATA); }

// ═══════════ SIDEBAR ═══════════
const MENU = [
  {id:'dashboard',label:'Dashboard',icon:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'},
  {id:'coach',label:'AI Koç',icon:'<path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>'},
  {id:'yks',label:'YKS Komuta',icon:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/><line x1="22" y1="2" x2="16" y2="8"/>'},
  {id:'study',label:'Çalışma',icon:'<path d="M12 14l9-5-9-5-9 5z"/><path d="M12 14l6.7-3.7"/><line x1="12" y1="14" x2="12" y2="21"/>'},
  {id:'sleep',label:'Uyku',icon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'},
  {id:'health',label:'Sağlık',icon:'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>'},
  {id:'youtube',label:'YouTube',icon:'<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>'},
  {id:'notes',label:'Notlar',icon:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>'},
  {id:'planner',label:'Planlayıcı',icon:'<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'},
  {id:'whywall',label:'Why Wall',icon:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>'},
  {id:'timemachine',label:'Zaman Makinesi',icon:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'},
  {id:'settings',label:'Ayarlar',icon:'<circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'}
];

function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = MENU.map(m => `
    <button onclick="switchTab('${m.id}')" class="sidebar-item ${activeTab===m.id?'active':''}" id="sb-${m.id}">
      <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${m.icon}</svg>
      <span class="menu-text">${m.label}</span>
    </button>
  `).join('');
}

function switchTab(id) {
  activeTab = id;
  DATA.settings.activeTab = id;
  save();
  renderSidebar();
  renderContent();
  closeSidebar();
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('open');
  document.getElementById('mobile-overlay').classList.toggle('hidden', !sb.classList.contains('open'));
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobile-overlay').classList.add('hidden');
}

// ═══════════ HEADER ═══════════
function updateClock() {
  const d = new Date();
  document.getElementById('header-time').textContent = 
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  document.getElementById('header-date').textContent = 
    d.getDate()+' '+['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'][d.getMonth()]+' '+
    d.getFullYear()+', '+['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][d.getDay()];
}
setInterval(updateClock, 10000); updateClock();

// ═══════════ AVATAR ═══════════
function loadAvatar() {
  const src = LS.get('avatar', '');
  if (src) {
    document.getElementById('avatar-img').src = src;
    document.getElementById('avatar-img').classList.remove('hidden');
    document.getElementById('avatar-svg').classList.add('hidden');
  }
}
function uploadAvatar(e) {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const c = document.createElement('canvas'), x = c.getContext('2d');
      const s = Math.min(200/img.width, 200/img.height, 1);
      c.width = img.width*s; c.height = img.height*s;
      x.drawImage(img, 0, 0, c.width, c.height);
      const b64 = c.toDataURL('image/jpeg', 0.8);
      LS.set('avatar', b64);
      loadAvatar();
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
}
loadAvatar();

// ═══════════ CONTENT RENDERER ═══════════
function renderContent() {
  const main = document.getElementById('main-content');
  switch(activeTab) {
    case 'dashboard': main.innerHTML = renderDashboard(); break;
    case 'coach': main.innerHTML = renderCoach(); break;
    case 'yks': main.innerHTML = renderYKS(); break;
    case 'study': main.innerHTML = renderStudy(); break;
    case 'sleep': main.innerHTML = renderSleep(); break;
    case 'health': main.innerHTML = renderHealth(); break;
    case 'youtube': main.innerHTML = renderYouTube(); break;
    case 'notes': main.innerHTML = renderNotes(); break;
    case 'planner': main.innerHTML = renderPlanner(); break;
    case 'whywall': main.innerHTML = renderWhyWall(); break;
    case 'timemachine': main.innerHTML = renderTimeMachine(); break;
    case 'settings': main.innerHTML = renderSettings(); break;
    default: main.innerHTML = renderDashboard();
  }
  // Init charts after DOM update
  setTimeout(initCharts, 200);
}

// ═══════════ DASHBOARD ═══════════
function renderDashboard() {
  const sleep = DATA.sleep, study = DATA.study, health = DATA.health, notes = DATA.notes.slice(0,3), tasks = DATA.tasks;
  const sleepAvg = (sleep.reduce((s,r)=>s+r.hours,0)/sleep.length).toFixed(1);
  const studyTotal = study.reduce((s,r)=>s+r.hours,0).toFixed(1);
  
  return `
    <div class="space-y-6 slide-in">
      <!-- KPI Row -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        ${kpiCard('😴 Uyku Ort.', sleepAvg+'s', '#ff1a1a')}
        ${kpiCard('📚 Çalışma', studyTotal+'s', '#0066ff')}
        ${kpiCard('👟 Adım', health.steps.toLocaleString(), '#00e676')}
        ${kpiCard('🔥 Kalori', health.calories+' kcal', '#ff6b00')}
      </div>

      <!-- Charts Row -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="glass p-5">
          <h3 class="text-sm font-semibold text-white/70 mb-4">📉 7 Günlük Uyku</h3>
          <div class="chart-wrap" style="height:220px"><canvas id="sleepChart"></canvas></div>
        </div>
        <div class="glass p-5">
          <h3 class="text-sm font-semibold text-white/70 mb-4">📊 Çalışma Saatleri</h3>
          <div class="chart-wrap" style="height:220px"><canvas id="studyChart"></canvas></div>
        </div>
      </div>

      <!-- Bottom Row: Health + Notes + Kanban -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="glass p-5">
          <h3 class="text-sm font-semibold text-white/70 mb-4">❤️ Sağlık Halkaları</h3>
          <div class="flex justify-around">
            ${ringCard('Adım', health.steps, 10000, '#00e676', 'stepsRing')}
            ${ringCard('Su (ml)', health.water, 2500, '#0066ff', 'waterRing')}
            ${ringCard('Kalori', health.calories, 2500, '#ff6b00', 'calRing')}
          </div>
        </div>
        <div class="glass p-5">
          <h3 class="text-sm font-semibold text-white/70 mb-3">📝 Hızlı Notlar</h3>
          <div class="space-y-3">
            ${notes.map(n=>`<div class="p-3 rounded-xl glass-light" style="border-left:3px solid ${n.color}"><p class="text-xs font-semibold text-white/80">${n.title}</p><p class="text-[11px] text-white/40 mt-1 line-clamp-2">${n.content}</p></div>`).join('')}
          </div>
        </div>
        <div class="glass p-5">
          <h3 class="text-sm font-semibold text-white/70 mb-3">📋 Mini Kanban</h3>
          <div class="space-y-2">
            ${tasks.map(t=>`<div class="flex items-center gap-2 px-3 py-2 rounded-lg text-xs glass-light"><span class="text-[10px] px-1.5 py-0.5 rounded-full ${t.status==='done'?'bg-green-500/20 text-green-400':t.status==='in_progress'?'bg-orange-500/20 text-orange-400':'bg-white/5 text-white/30'}">${t.status==='done'?'✓':t.status==='in_progress'?'▶':'○'}</span><span class="text-white/60 ${t.status==='done'?'line-through opacity-40':''}">${t.title}</span></div>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
}

function kpiCard(label, value, color) {
  return `<div class="glass p-4 hover:border-white/10 transition"><p class="text-[10px] text-white/30 uppercase tracking-wider mb-1">${label}</p><p class="text-2xl font-bold" style="color:${color}">${value}</p></div>`;
}

function ringCard(label, value, max, color, id) {
  const pct = Math.min(value/max*100, 100);
  const circumference = 2 * Math.PI * 36;
  const offset = circumference - (pct/100) * circumference;
  return `<div class="text-center"><svg width="90" height="90" viewBox="0 0 90 90"><circle cx="45" cy="45" r="36" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"/><circle id="${id}" cx="45" cy="45" r="36" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}" class="ring-fg" transform="rotate(-90 45 45)"/><text x="45" y="48" text-anchor="middle" fill="white" font-size="14" font-weight="700">${Math.round(pct)}%</text></svg><p class="text-[10px] text-white/30 mt-1">${label}</p></div>`;
}

// ═══════════ ACTIONS ═══════════
function searchYouTube() {

  if (!q) return;

function addNote() {
  const title = document.getElementById('note-title')?.value.trim();
  if (!title) return;
  DATA.notes.push({id:Date.now(),title,content:'',color:['#ff1a1a','#ff6b00','#0066ff','#00e676','#b700ff'][Math.floor(Math.random()*5)]});
  save(); renderContent();
}

function updateNote(idx, content) { DATA.notes[idx].content = content; save(); }
function deleteNote(idx) { DATA.notes.splice(idx,1); save(); renderContent(); }

function moveTask(id, newStatus) {
  const t = DATA.tasks.find(t=>t.id===id);
  if (t) { t.status = newStatus; save(); renderContent(); }
}

function addWhy() {
  const w = prompt('Nedenini yaz:');
  if (w) { DATA.whywalls.push(w); save(); renderContent(); }
}

function resetData() {
  if (confirm('Tüm veriler sıfırlansın mı?')) {
    localStorage.clear();
    DATA = defaultData();
    save();
    renderContent();
  }
}

// ═══════════ FOCUS BLAST ═══════════
function startFocusBlast() {
  focusTask = prompt('Ne üzerine odaklanacaksınız?', 'Deep Focus') || 'Deep Focus';
  focusSeconds = 25 * 60;
  focusRunning = true;
  const overlay = document.getElementById('focus-overlay');
  document.getElementById('focus-task-label').textContent = focusTask;
  overlay.classList.remove('hidden');
  updateFocusDisplay();
  focusInterval = setInterval(() => {
    focusSeconds--;
    updateFocusDisplay();
    if (focusSeconds <= 0) stopFocus();
  }, 1000);
}

function updateFocusDisplay() {
  const m = Math.floor(focusSeconds/60), s = focusSeconds%60;
  document.getElementById('focus-countdown').textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function pauseFocus() {
  if (focusRunning) { clearInterval(focusInterval); focusRunning = false; }
  else { focusRunning = true; focusInterval = setInterval(()=>{focusSeconds--;updateFocusDisplay();if(focusSeconds<=0)stopFocus();},1000); }
}

function stopFocus() {
  clearInterval(focusInterval);
  focusRunning = false;
  document.getElementById('focus-overlay').classList.add('hidden');
}

// ═══════════ PARTICLES ═══════════
function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100+'%';
    p.style.animationDuration = (8+Math.random()*20)+'s';
    p.style.animationDelay = Math.random()*10+'s';
    p.style.width = (1+Math.random()*2)+'px';
    p.style.height = p.style.width;
    container.appendChild(p);
  }
}

// ═══════════ INIT ═══════════
function init() {
  createParticles();
  renderSidebar();
  renderContent();
}

init();
